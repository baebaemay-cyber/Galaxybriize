<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 MKMA · เติมดาวในกาแลกซี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--purple:#6b3fb0;--purple2:#8a5bd6;--cream:#fdf3dc;--ink:#fff;--mut:#b9a8d9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Mali","Noto Sans Thai",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
.view{position:relative;z-index:1;min-height:100%;display:none;flex-direction:column;align-items:center}
.view.on{display:flex}
/* home */
.logo{margin-top:clamp(20px,6vh,70px);width:min(620px,86vw);border-radius:16px;display:block}
.stack{margin-top:clamp(28px,7vh,80px);width:min(400px,84vw);display:flex;flex-direction:column;gap:22px;align-items:stretch}
.stack label{text-align:center;font-size:1.35rem;font-weight:600}
#handle{height:88px;border-radius:18px;border:0;background:var(--purple);color:#fff;text-align:center;font-family:"Pinyon Script","Mali",cursive;font-size:2.7rem;width:100%;padding:0 16px}
.big{height:88px;border-radius:18px;background:var(--purple);color:#fff;font-size:1.5rem;font-weight:600}
.big:hover{background:var(--purple2)}
.pills{margin:auto 0 0;padding:40px 16px 48px;display:flex;flex-wrap:wrap;gap:18px 40px;justify-content:center;max-width:1100px}
.pill{background:var(--cream);color:#1a1230;border-radius:999px;padding:14px 30px;font-size:1.15rem;font-weight:600}
.pill:hover{background:#fff}
.err{color:#ffb4c0;text-align:center;min-height:1.4em;margin:0}
/* galaxy views */
.top{position:fixed;z-index:3;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px}
.chip{background:rgba(20,10,40,.72);border:1px solid #4b3a78;color:#fff;border-radius:999px;padding:10px 18px;backdrop-filter:blur(6px)}
.chip b{font-size:1.2rem}
.panel{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,94vw);background:rgba(15,8,30,.82);border:1px solid #4b3a78;border-radius:20px;padding:16px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px}
.drop{border:2px dashed #6b5aa0;border-radius:14px;padding:16px;text-align:center;color:var(--mut);cursor:pointer}
.drop img{max-height:120px;max-width:100%;border-radius:8px;display:block;margin:0 auto 8px}
.go{height:54px;border-radius:14px;background:var(--purple);color:#fff;font-size:1.2rem;font-weight:600}
.go:disabled{opacity:.5;cursor:default}
.msg{margin:0;text-align:center;min-height:1.3em;font-size:.95rem}
.ok{color:#bdf5cf}
.hist{max-height:30vh;overflow:auto;font-size:.9rem;color:var(--mut);margin:0;padding-left:1.2em}
.board{position:fixed;z-index:3;right:14px;top:calc(70px + env(safe-area-inset-top,0px));max-height:40vh;overflow:auto;background:rgba(20,10,40,.72);border:1px solid #4b3a78;border-radius:14px;padding:10px 14px;font-size:.9rem;min-width:170px}
.board div{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
dialog{border:0;border-radius:20px;background:#d9b8ff;padding:14px;max-width:min(1000px,94vw);color:#1a1230}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog img{max-width:100%;max-height:78vh;display:block;border-radius:12px}
dialog h2{margin:0 0 10px;font-size:1.2rem}
dialog button{margin-top:10px;background:var(--purple);color:#fff;border-radius:999px;padding:8px 22px}
button.big,button.pill,button.go,button.chip{background:linear-gradient(160deg,rgba(255,255,255,.8) 0,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 66%,rgba(255,255,255,.65) 100%),#d3b6ff;color:#2b1257;border:3px solid #9a6be0;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),5px 6px 0 -1px #8a5bd6,0 0 22px rgba(138,91,214,.4);font-family:inherit;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.5);transition:transform .12s,box-shadow .12s}
button.big:hover,button.pill:hover,button.go:hover:not(:disabled),button.chip:hover{background:linear-gradient(160deg,rgba(255,255,255,.9) 0,rgba(255,255,255,.1) 32%,rgba(255,255,255,.05) 66%,rgba(255,255,255,.75) 100%),#dcc4ff;transform:translateY(-2px)}
button.big:active,button.pill:active,button.go:active:not(:disabled),button.chip:active{transform:translate(3px,3px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),2px 3px 0 -1px #8a5bd6,0 0 14px rgba(138,91,214,.4)}
#handle{background:linear-gradient(160deg,rgba(255,255,255,.8) 0,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 66%,rgba(255,255,255,.65) 100%),#d3b6ff;color:#2b1257;border:3px solid #9a6be0;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),5px 6px 0 -1px #8a5bd6,0 0 22px rgba(138,91,214,.4)}
#handle:focus-visible{outline-color:#fff}
.fl{display:flex;gap:8px}.fl label{flex:1;font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.fl input{height:40px;border-radius:10px;border:1px solid #6b5aa0;background:#0d0820;color:#fff;padding:0 10px;font:inherit;font-size:.95rem;width:100%}
#chk{display:flex;flex-direction:column;gap:8px}#chk[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>

/* ====== ตั้งค่าฐานข้อมูลรวม (Firebase Firestore) — ดู README ====== */
const CFG={apiKey:"",projectId:""};
const REMOTE=!!(CFG.apiKey&&CFG.projectId);
const FS=`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents`;
const wrap=o=>JSON.stringify({fields:{json:{stringValue:JSON.stringify(o)}}});
const unwrap=d=>JSON.parse(d.fields.json.stringValue);
const store={
  async get(col,id){
    if(!REMOTE){try{const v=localStorage.getItem(`mkma:${col}:${id}`);return v?JSON.parse(v):null}catch(e){return null}}
    const r=await fetch(`${FS}/${col}/${encodeURIComponent(id)}?key=${CFG.apiKey}`);
    if(r.status===404)return null;if(!r.ok)throw new Error("get");return unwrap(await r.json())},
  async set(col,id,obj,createOnly){
    if(!REMOTE){const k=`mkma:${col}:${id}`;if(createOnly&&localStorage.getItem(k))return false;localStorage.setItem(k,JSON.stringify(obj));return true}
    const u=`${FS}/${col}/${encodeURIComponent(id)}?key=${CFG.apiKey}`+(createOnly?"&currentDocument.exists=false":"");
    const r=await fetch(u,{method:"PATCH",headers:{"Content-Type":"application/json"},body:wrap(obj)});
    if(createOnly&&(r.status===409||r.status===400))return false;if(!r.ok)throw new Error("set");return true},
  async list(col){
    if(!REMOTE){const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(`mkma:${col}:`)){try{out.push(JSON.parse(localStorage.getItem(k)))}catch(e){}}}return out}
    const out=[];let tok="";
    do{const r=await fetch(`${FS}/${col}?pageSize=300&key=${CFG.apiKey}${tok?"&pageToken="+tok:""}`);if(!r.ok)throw new Error("list");
      const j=await r.json();(j.documents||[]).forEach(d=>out.push(unwrap(d)));tok=j.nextPageToken||""}while(tok);
    return out}
};

const $=s=>document.querySelector(s);
const norm=h=>(h||"").trim().replace(/^@+/,"").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30);
let handle="",view="home",unsub=null,items={},fileBlob=null,fresh=0,stage=0;
try{const s=localStorage.getItem("mkma_handle");if(s)$("#handle").value="@"+s}catch(e){}

/* ---------- starfield ---------- */
const cv=$("#bg"),cx=cv.getContext("2d");let W=0,H=0,stars=[],dust=[],t0=performance.now(),freshUntil=0;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const COL=["255,255,255","214,196,255","255,236,170","190,220,255"];
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);const r=rng(7);dust=Array.from({length:260},()=>({x:r(),y:r(),s:r()*1.1+.2,p:r()*6.28,v:.3+r()*1.2}))}
function build(groups,cap){
  const total=groups.reduce((a,g)=>a+g.n,0),k=total>cap?cap/total:1;stars=[];
  for(const g of groups){const n=g.n>0?Math.max(1,Math.round(g.n*k)):0,r=rng(hash(g.h));
    for(let i=0;i<n;i++){stars.push({x:r(),y:r(),s:.25+Math.pow(r(),3)*.9,p:r()*6.28,v:.6+r()*2.2,c:"rgb("+COL[Math.floor(r()*4)]+")",f:g.fresh&&i>=n-Math.min(g.fresh,n)})}}
}
function frame(now){
  const t=(now-t0)/1000;cx.clearRect(0,0,W,H);
  for(const d of dust){cx.globalAlpha=.25+.25*Math.sin(t*d.v+d.p);cx.fillStyle="#fff";cx.fillRect(d.x*W,d.y*H,d.s,d.s)}
  if(view!=="home"){const hot=now<freshUntil;
    for(const s of stars){const fh=s.f&&hot,sz=s.s*(fh?2.6:1);
      cx.globalAlpha=fh?1:.45+.55*Math.sin(t*s.v+s.p)**2;cx.fillStyle=fh?"#ffe678":s.c;cx.fillRect(s.x*W,s.y*H,sz,sz)}}
  cx.globalAlpha=1;requestAnimationFrame(frame)}
addEventListener("resize",resize);resize();requestAnimationFrame(frame);

/* ---------- routing ---------- */
function show(v){view=v;for(const e of document.querySelectorAll(".view"))e.classList.toggle("on",e.id===({home:"home",mine:"mine",all:"all"}[v]));
  if(unsub){unsub();unsub=null}stars=[]}
function route(){const h=location.hash.slice(1);
  if(h==="fill"&&handle){show("mine");loadMine()}
  else if(h==="all"){show("all");loadAll()}
  else show("home")}
addEventListener("hashchange",route);
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>{location.hash="";route()});
$("#toAll").onclick=()=>{location.hash="all"};
$("#fill").onclick=()=>{const h=norm($("#handle").value);
  if(!h){$("#herr").textContent="ใส่ชื่อทวิตก่อนนะ เช่น @mydear";return}
  $("#herr").textContent="";handle=h;try{localStorage.setItem("mkma_handle",h)}catch(e){}location.hash="fill"};
$("#handle").addEventListener("keydown",e=>{if(e.key==="Enter")$("#fill").click()});
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g;$("#dt").textContent=TITLE[g];$("#di").src=IMG[g];$("#di").alt=TITLE[g];$("#dlg").showModal()});
$("#dc").onclick=()=>$("#dlg").close();

/* ---------- my galaxy ---------- */
const total=()=>Object.values(items).reduce((a,i)=>a+(i.votes||0),0);
function setMsg(t,c){const m=$("#msg");m.textContent=t;m.className="msg "+(c||"")}
function paintMine(){const n=total();$("#cnt").textContent=n.toLocaleString("th-TH");$("#who").textContent="@"+handle;
  build([{h:handle,n,fresh}],20000);
  const rows=Object.entries(items).sort((a,b)=>(b[1].day+b[1].time).localeCompare(a[1].day+a[1].time));
  $("#hist").innerHTML="";for(const[id,i]of rows){const li=document.createElement("li");li.textContent=`วันที่โหวต ${i.day} (${i.date} ${i.time} KST) · +${i.votes} ดาว · เลข ${id}`;$("#hist").appendChild(li)}}
function resetForm(){stage=0;fileBlob=null;$("#file").value="";$("#chk").hidden=true;$("#go").textContent="อ่าน certificate";$("#go").disabled=true;$("#dropTxt").textContent="แตะเพื่อเลือกรูป certificate"}
async function loadMine(){
  items={};fresh=0;resetForm();paintMine();setMsg("กำลังโหลดกาแลกซีของคุณ...");
  try{const d=await store.get("galaxy",handle);items=(d&&d.items)||{};paintMine();
    setMsg(d?"ยินดีต้อนรับกลับมา เติมดาวต่อได้เลย":"กาแลกซีใหม่! อัปโหลด certificate เพื่อเริ่มเติมดาว",d?"ok":"")}
  catch(e){setMsg("โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชอีกครั้ง","err")}}

$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;fileBlob=f;stage=0;$("#chk").hidden=true;
  const im=document.createElement("img");im.src=URL.createObjectURL(f);im.alt="certificate";$("#dropTxt").textContent="";$("#dropTxt").append(im,"แตะเพื่อเปลี่ยนรูป");
  $("#go").textContent="อ่าน certificate";$("#go").disabled=false;setMsg("")};

/* ---------- อ่าน certificate ด้วย OCR ในเบราว์เซอร์ ---------- */
function prep(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=im.width<1600?2:1,c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
  const g=c.getContext("2d");g.filter="grayscale(1) contrast(1.4)";g.drawImage(im,0,0,c.width,c.height);res(c)};im.onerror=rej;im.src=URL.createObjectURL(f)})}
const p2=n=>String(n).padStart(2,"0");
function parse(text){
  const t=text.replace(/[|]/g,"1");let certNo="",date="",time="",votes="";
  const cm=t.match(/Cert\.?\s*No\.?\s*[:：]?\s*([A-Za-z0-9\-_]{6,40})/i);if(cm)certNo=cm[1];
  const dm=t.match(/(\d{2,4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s+(\d{1,2}):(\d{2}):(\d{2})/);
  if(dm){let y=+dm[1];if(y<100)y+=2000;date=`${y}-${p2(dm[2])}-${p2(dm[3])}`;time=`${p2(dm[4])}:${dm[5]}:${dm[6]}`}
  for(const ln of t.split(/\n/)){if(/cert|:|KST|round|\./i.test(ln))continue;const m=ln.match(/(\d{1,3}(?:,\d{3})+|\d{2,7})\s*$/);if(m){votes=m[1].replace(/,/g,"");break}}
  return{certNo,date,time,votes}}
function koreaDay(date,time){const[y,m,d]=date.split("-").map(Number),hh=+time.split(":")[0];return new Date(Date.UTC(y,m-1,d+(hh>=22?1:0))).toISOString().slice(0,10)}

$("#go").onclick=async()=>{
  const btn=$("#go");
  if(stage===0){
    if(!fileBlob)return;btn.disabled=true;setMsg("กำลังอ่านรูป รอสักครู่ (ครั้งแรกอาจช้า)...");
    let p={certNo:"",date:"",time:"",votes:""};
    try{if(!window.Tesseract)throw 0;const c=await prep(fileBlob);const r=await Tesseract.recognize(c,"eng");p=parse(r.data.text)}catch(e){}
    $("#fCert").value=p.certNo;$("#fVotes").value=p.votes;$("#fDate").value=p.date;$("#fTime").value=p.time;$("#chk").hidden=false;
    const ok=p.certNo&&p.votes&&p.date&&p.time;
    setMsg(ok?"ตรวจความถูกต้องของข้อมูล แก้ไขได้ แล้วกดยืนยัน":"อ่านได้ไม่ครบ กรอกช่องที่ว่างให้ตรงกับ certificate แล้วกดยืนยัน",ok?"ok":"err");
    stage=1;btn.textContent="ยืนยันเติมดาว";btn.disabled=false;return}
  const certNo=$("#fCert").value.replace(/[^A-Za-z0-9_-]/g,"").toUpperCase().slice(0,100),votes=parseInt($("#fVotes").value.replace(/,/g,""),10),date=$("#fDate").value.trim(),tm0=$("#fTime").value.trim();
  if(certNo.length<4||!(votes>0)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{1,2}:\d{2}(:\d{2})?$/.test(tm0)){setMsg("ข้อมูลไม่ครบ เลขใบ โหวต วันที่ (ปปปป-ดด-วว) และเวลา (ชช:นน:วว)","err");return}
  const time=tm0.length<=5?p2(tm0.split(":")[0])+":"+tm0.split(":")[1]+":00":tm0,day=koreaDay(date,time);
  btn.disabled=true;setMsg("กำลังบันทึก...");
  try{
    const fresh_=await store.set("certs",certNo,{handle,votes,day,date,time},true);
    if(!fresh_){const ex=await store.get("certs",certNo);setMsg(ex&&ex.handle===handle?"certificate ใบนี้เติมดาวไปแล้ว":"certificate ใบนี้ถูกใช้ไปแล้ว","err");btn.disabled=false;return}
    const cur=await store.get("galaxy",handle),it=(cur&&cur.items)||{};it[certNo]={votes,day,date,time};items=it;
    await store.set("galaxy",handle,{handle,items:it});
    fresh=votes;paintMine();freshUntil=performance.now()+4500;
    setMsg(`เติมดาว +${votes} ดวง (นับเป็นวันโหวต ${day})`,"ok");resetForm();
    $("#dropTxt").textContent="แตะเพื่อเลือกรูป certificate ใบต่อไป";
  }catch(e){setMsg("บันทึกไม่สำเร็จ ลองอีกครั้ง","err");btn.disabled=false}
};

/* ---------- download image ---------- */
async function savePng(kind){
  const say=x=>kind==="mine"?setMsg(x,"err"):($("#allmsg").textContent=x);
  if(kind==="mine")setMsg("กำลังสร้างรูป...");
  try{await savePng0(kind)}catch(e){say("บันทึกรูปไม่สำเร็จ: "+(e&&e.message||e))}}
async function savePng0(kind){
  const mine=kind==="mine",say=t=>mine?setMsg(t,"err"):($("#allmsg").textContent=t);
  if(!stars.length){say("ยังไม่มีดาวให้บันทึก");return}
  try{await document.fonts.load('700 64px Mali','ดวงดาว')}catch(e){}
  const w=1920,h=1080,c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
  g.fillStyle="#000";g.fillRect(0,0,w,h);
  const r=rng(7);g.fillStyle="#fff";for(let i=0;i<320;i++){g.globalAlpha=.2+r()*.3;const z=r()*1.2+.3;g.fillRect(r()*w,r()*h,z,z)}
  for(const s of stars){g.globalAlpha=.55+.4*((s.p/6.28)%1);g.fillStyle=s.c;const z=Math.max(1,s.s*1.6);g.fillRect(s.x*w,s.y*h,z,z)}
  g.globalAlpha=1;g.textAlign="left";g.shadowColor="rgba(0,0,0,.9)";g.shadowBlur=18;
  const title=mine?"ดวงดาวในกาแลกซีของ @"+handle:"กาแลกซีรวม 2027 MKMA";
  const sub=mine?`ดาว ${$("#cnt").textContent} ดวง`:`${$("#nusers").textContent} คน · ดาว ${$("#tot").textContent} ดวง`;
  const fit=(txt,wt,size,y,col)=>{let s=size;g.fillStyle=col;do{g.font=`${wt} ${s}px Mali,"Noto Sans Thai",sans-serif`;if(g.measureText(txt).width<=w*.88)break;s-=2}while(s>16);g.fillText(txt,(w-g.measureText(txt).width)/2,y)};
  fit(title,700,44,h-92,"#fff");fit(sub,400,28,h-44,"#d6c4ff");
  const blob=await new Promise(res=>{try{c.toBlob(res,"image/png")}catch(e){res(null)}});
  const url=blob?URL.createObjectURL(blob):c.toDataURL("image/png"),fn=mine?`galaxy-${handle}.png`:"galaxy-all.png";
  $("#dt").textContent="รูปกาแลกซี (กดค้างที่รูปแล้วเลือกบันทึกรูป หรือกดปุ่มดาวน์โหลด)";$("#di").src=url;$("#di").alt=fn;
  let l=$("#dsave");if(!l){l=document.createElement("a");l.id="dsave";l.textContent="ดาวน์โหลดรูป";l.style.cssText="display:inline-block;margin:10px 10px 0 0;background:#6b3fb0;color:#fff;border-radius:999px;padding:8px 22px;text-decoration:none";$("#dc").before(l)}
  l.href=url;l.download=fn;$("#dlg").showModal();if(mine)setMsg("สร้างรูปแล้ว","ok")}
$("#dlg").addEventListener("close",()=>{const l=$("#dsave");if(l)l.remove()});
$("#dlMine").onclick=()=>savePng("mine");$("#dlAll").onclick=()=>savePng("all");

/* ---------- combined galaxy ---------- */
async function paintAll(){
  const docs=await store.list("galaxy");
  const rows=docs.filter(d=>d&&d.handle).map(d=>({h:d.handle,n:Object.values(d.items||{}).reduce((a,i)=>a+(i.votes||0),0)})).sort((a,b)=>b.n-a.n);
  const tot=rows.reduce((a,r)=>a+r.n,0);$("#tot").textContent=tot.toLocaleString("th-TH");$("#nusers").textContent=rows.length;
  build(rows,30000);
  const b=$("#board");b.hidden=!rows.length;b.innerHTML="";
  for(const r of rows.slice(0,20)){const d=document.createElement("div"),a=document.createElement("span"),c=document.createElement("span");a.textContent="@"+r.h;c.textContent=r.n.toLocaleString("th-TH");d.append(a,c);b.appendChild(d)}
  $("#allmsg").textContent=rows.length?(REMOTE?"":"โหมดทดสอบ: ข้อมูลเก็บในเครื่องนี้เท่านั้น"):"ยังไม่มีใครเติมดาว มาเป็นคนแรกเลย"}
async function loadAll(){
  $("#allmsg").textContent="กำลังโหลดกาแลกซีรวม...";
  const run=async()=>{try{await paintAll()}catch(e){$("#allmsg").textContent="โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชอีกครั้ง"}};
  await run();const id=setInterval(run,20000);unsub=()=>clearInterval(id)}
route();
</script>
</body>
